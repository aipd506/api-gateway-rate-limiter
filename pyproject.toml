[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-gateway-rate-limiter"
version = "0.1.0"
description = "High-throughput Token Bucket, Leaky Bucket, and Sliding Window Counter rate limiting algorithms, multi-tier per-tenant quotas, and IETF RFC standard HTTP rate-limiting header generator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "aipd506" }
]
keywords = ["rate-limiter", "token-bucket", "leaky-bucket", "sliding-window", "api-gateway", "rfc6585"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
apilimit = "apilimit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apilimit*"]
